name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  # scan_js:
    # runs-on: ubuntu-latest

    # steps:
      # - name: Checkout code
        # uses: actions/checkout@v7

      # - name: Set up Ruby
        # uses: ruby/setup-ruby@v1
        # with:
          # bundler-cache: true

      # - name: Scan for security vulnerabilities in JavaScript dependencies
        # run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database
        run: |
          until docker compose exec -T db pg_isready -U postgres; do
            sleep 2
          done

      - name: Prepare test database
        run: docker compose run --rm web bin/rails db:test:prepare

      - name: Run RSpec
        run: docker compose run --rm web bundle exec rspec --exclude-pattern "spec/system/**/*_spec.rb"

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  system-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d db chrome web

      - name: Wait for database
        run: |
          until docker compose exec -T db pg_isready -U postgres; do
            sleep 2
          done

      - name: Wait for Chrome
        run: |
          until curl --silent --fail http://localhost:4444/status > /dev/null; do
            sleep 2
          done

      - name: Prepare test database
        run: docker compose exec -T web bin/rails db:test:prepare

      - name: Run system tests
        run: docker compose exec -T web bundle exec rspec spec/system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v